{% extends "base.html" %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Yeni Müşteri Ekle</h1>

    <form action="{{ url_for('add_customer') }}" method="POST">

        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-semibold mb-2">Adı Soyadı *</label>
            <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="phone" class="block text-gray-700 font-semibold mb-2">Telefon Numarası</label>
                <input type="tel" id="phone" name="phone" value="{{ form_data.phone if form_data else '' }}" placeholder="Örn: 5551234567" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                 <p class="text-xs text-gray-500 mt-1">Bu numara sistemde benzersiz olmalıdır.</p>
            </div>
            <div>
                <label for="email" class="block text-gray-700 font-semibold mb-2">E-posta Adresi</label>
                <input type="email" id="email" name="email" value="{{ form_data.email if form_data else '' }}" placeholder="Örn: email@ornek.com" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                 <p class="text-xs text-gray-500 mt-1">Bu e-posta sistemde benzersiz olmalıdır.</p>
            </div>
        </div>

        <div class="mb-4">
            <label for="customer_type" class="block text-gray-700 font-semibold mb-2">Müşteri Tipi *</label>
            <select id="customer_type" name="customer_type" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <option value="" {% if not form_data or not form_data.customer_type %}selected{% endif %}>Seçiniz...</option>
                <option value="Alıcı" {% if form_data and form_data.customer_type == 'Alıcı' %}selected{% endif %}>Alıcı</option>
                <option value="Satıcı" {% if form_data and form_data.customer_type == 'Satıcı' %}selected{% endif %}>Satıcı</option>
                <option value="Kiracı" {% if form_data and form_data.customer_type == 'Kiracı' %}selected{% endif %}>Kiracı</option>
                <option value="Potansiyel" {% if form_data and form_data.customer_type == 'Potansiyel' %}selected{% endif %}>Potansiyel</option>
                <option value="Diğer" {% if form_data and form_data.customer_type == 'Diğer' %}selected{% endif %}>Diğer</option>
            </select>
        </div>

        <div class="mb-6">
            <label for="notes" class="block text-gray-700 font-semibold mb-2">Notlar</label>
            <textarea id="notes" name="notes" rows="4" placeholder="Müşteri ile ilgili önemli notlar, tercihler vb." class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ form_data.notes if form_data else '' }}</textarea>
        </div>

        <div class="text-right">
            <button type="submit" class="bg-teal-600 hover:bg-teal-800 text-white font-bold py-2 px-6 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-opacity-50">
                Müşteri Ekle
            </button>
        </div>
    </form>
</div>
{% endblock %}
