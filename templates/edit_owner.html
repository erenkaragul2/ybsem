{% extends "base.html" %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-lg max-w-2xl mx-auto">
    <h1 class="text-3xl font-semibold text-gray-800 mb-8 text-center">Emlak Sahibi Düzenle (ID: {{ owner['id'] }})</h1>

    <form action="{{ url_for('edit_owner', owner_id=owner['id']) }}" method="POST" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Adı Soyadı *</label>
            <input type="text" id="name" name="name" value="{{ owner['name'] | default('', true) }}" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Telefon Numarası</label>
                <input type="tel" id="phone" name="phone" value="{{ owner['phone'] | default('', true) }}" placeholder="Örn: 555 123 4567" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                 <p class="text-xs text-gray-500 mt-1">Bu numara sistemde benzersiz olmalıdır.</p>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-posta Adresi</label>
                <input type="email" id="email" name="email" value="{{ owner['email'] | default('', true) }}" placeholder="Örn: isim@ornek.com" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                 <p class="text-xs text-gray-500 mt-1">Bu e-posta sistemde benzersiz olmalıdır.</p>
            </div>
        </div>
        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notlar</label>
            <textarea id="notes" name="notes" rows="5" placeholder="Emlak sahibi ile ilgili notlar..." class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">{{ owner['notes'] | default('', true) }}</textarea>
        </div>
        <div class="pt-4 flex justify-end space-x-3">
             <a href="{{ url_for('list_owners') }}" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                İptal
            </a>
            <button type="submit" class="inline-flex justify-center py-2 px-6 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-150 ease-in-out">
                Güncelle
            </button>
        </div>
    </form>
</div>
{% endblock %}
