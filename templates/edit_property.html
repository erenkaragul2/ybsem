{% extends "base.html" %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-lg max-w-3xl mx-auto">
    <h1 class="text-3xl font-semibold text-gray-800 mb-8 text-center">Emlak Düzenle (ID: {{ property['id'] }})</h1>
    <form action="{{ url_for('edit_property', property_id=property['id']) }}" method="POST" class="space-y-6">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">İlan Başlığı *</label>
            <input type="text" id="title" name="title" value="{{ property['title'] | default('', true) }}" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
        </div>
        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Açıklama</label>
            <textarea id="description" name="description" rows="5" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">{{ property['description'] | default('', true) }}</textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="property_type" class="block text-sm font-medium text-gray-700 mb-1">Emlak Tipi *</label>
                <select id="property_type" name="property_type" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white" required>
                    <option value="" {% if not property['property_type'] %}selected{% endif %}>Seçiniz...</option>
                    <option value="Daire" {% if property['property_type'] == 'Daire' %}selected{% endif %}>Daire</option>
                    <option value="Villa" {% if property['property_type'] == 'Villa' %}selected{% endif %}>Villa</option>
                    <option value="Müstakil Ev" {% if property['property_type'] == 'Müstakil Ev' %}selected{% endif %}>Müstakil Ev</option>
                    <option value="Rezidans" {% if property['property_type'] == 'Rezidans' %}selected{% endif %}>Rezidans</option>
                    <option value="Yazlık" {% if property['property_type'] == 'Yazlık' %}selected{% endif %}>Yazlık</option>
                    <option value="Arsa" {% if property['property_type'] == 'Arsa' %}selected{% endif %}>Arsa</option>
                    <option value="İş Yeri" {% if property['property_type'] == 'İş Yeri' %}selected{% endif %}>İş Yeri</option>
                    <option value="Diğer" {% if property['property_type'] == 'Diğer' %}selected{% endif %}>Diğer</option>
                </select>
            </div>
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Durum *</label>
                 <select id="status" name="status" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white" required>
                    <option value="Satılık" {% if property['status'] == 'Satılık' %}selected{% endif %}>Satılık</option>
                    <option value="Kiralık" {% if property['status'] == 'Kiralık' %}selected{% endif %}>Kiralık</option>
                    <option value="Satıldı" {% if property['status'] == 'Satıldı' %}selected{% endif %}>Satıldı</option>
                    <option value="Kiralandı" {% if property['status'] == 'Kiralandı' %}selected{% endif %}>Kiralandı</option>
                </select>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Fiyat (TL)</label>
                <input type="number" id="price" name="price" step="0.01" value="{{ property['price'] | default('', true) }}" placeholder="Örn: 1500000" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="area" class="block text-sm font-medium text-gray-700 mb-1">Alan (m²)</label>
                <input type="number" id="area" name="area" step="0.1" value="{{ property['area'] | default('', true) }}" placeholder="Örn: 120" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label for="rooms" class="block text-sm font-medium text-gray-700 mb-1">Oda Sayısı</label>
                <input type="text" id="rooms" name="rooms" value="{{ property['rooms'] | default('', true) }}" placeholder="Örn: 3+1" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
        </div>
         <div>
            <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Adres</label>
            <input type="text" id="address" name="address" value="{{ property['address'] | default('', true) }}" placeholder="Mahalle, Sokak, No..." class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="city" class="block text-sm font-medium text-gray-700 mb-1">Şehir *</label>
                <input type="text" id="city" name="city" value="{{ property['city'] | default('', true) }}" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
            <div>
                <label for="district" class="block text-sm font-medium text-gray-700 mb-1">İlçe *</label>
                <input type="text" id="district" name="district" value="{{ property['district'] | default('', true) }}" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
            </div>
        </div>
         <div>
            <label for="owner_id" class="block text-sm font-medium text-gray-700 mb-1">Emlak Sahibi</label>
            <select id="owner_id" name="owner_id" class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                <option value="">Sahip Seçiniz (Opsiyonel)...</option>
                {% for owner in owners %}
                 <option value="{{ owner['id'] }}" {% if property['owner_id'] == owner['id'] %}selected{% endif %}>{{ owner['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="pt-4 flex justify-end space-x-3">
             <a href="{{ url_for('list_properties') }}" class="inline-flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                İptal
            </a>
            <button type="submit" class="inline-flex justify-center py-2 px-6 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                Güncelle
            </button>
        </div>
    </form>
</div>
{% endblock %}
