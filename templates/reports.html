{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">{{ page_title }}</h1>

    {# Flash mesajları base.html tarafından zaten gösteriliyor #}

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <div class="px-6 py-4 bg-gray-50 border-b border-gray-200">
            <h2 class="text-lg font-medium text-gray-700">Rapor Seçimi</h2>
        </div>
        <div class="px-6 py-5">
            <form method="POST" action="{{ url_for('reports') }}">
                <div class="mb-5">
                    <label for="report_type" class="block text-sm font-medium text-gray-700 mb-1">Oluşturulacak Rapor Türü:</label>
                    <select id="report_type" name="report_type" required
                            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="" selected disabled>-- Rapor Türü Seçin --</option>
                        <option value="properties">Emlaklar Raporu</option>
                        <option value="customers">Müşteriler Raporu (Aktif)</option>
                        <option value="owners">Emlak Sahipleri Raporu</option>
                        <option value="personnel">Personel Raporu</option>
                        <option value="contracts">Sözleşmeler Raporu</option>
                    </select>
                </div>
                <div class="flex justify-end">
                    <button type="submit"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        
                        <svg class="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414A2 2 0 0015.414 6L12 2.586A2 2 0 0010.586 2H6zm4 6a1 1 0 100 2h4a1 1 0 100-2h-4zM6 12a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" />
                        </svg> 
                        PDF Rapor Oluştur
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
